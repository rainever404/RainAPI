name: new-api

networks:
  1panel-network:
    external: true

services:
  new-api:
    image: ${RAINAPI_IMAGE:?Set RAINAPI_IMAGE to an immutable RainAPI image tag}
    container_name: ${CONTAINER_NAME:-new-api}
    command: --log-dir /app/logs
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
      - TZ=${TZ}
      - SQL_DSN=${SQL_DSN:?Set SQL_DSN in the untracked production .env file}
      - NODE_NAME=new-api-hi-rain
      - ERROR_LOG_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:3000/api/status | grep -o '"success":\s*true' || exit 1
      timeout: 10s
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3000
    restart: always
    volumes:
      - ./data:/data
      - ./logs:/app/logs
